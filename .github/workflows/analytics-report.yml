name: Analytics report

# Раз в неделю (или по кнопке /analytics) собирает GSC-данные по опубликованным
# статьям, классифицирует их (winners/needs_boost/flat/new), пишет отчёт
# в analytics/report.md, коммитит в репозиторий и присылает сводку в TG.
# performance-метки проставляет в taxonomy.json — используется в publish.py
# для приоритизации related-статей.

on:
  workflow_dispatch:
  schedule:
    # Понедельник 10:00 UTC — за час до keyword-research, чтобы её данные
    # уже влияли на выбор новых тем.
    - cron: '0 10 * * 1'

permissions:
  contents: write

concurrency:
  group: analytics-report
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r automation/requirements.txt
          pip install google-api-python-client

      - name: Run analytics
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automation/analytics.py --lang ru --telegram --update-taxonomy

      - name: Commit analytics + taxonomy update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f analytics/ automation/taxonomy.json || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Analytics: weekly report + taxonomy performance labels"
            git pull --rebase origin main || true
            git push
          fi
