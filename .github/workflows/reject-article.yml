name: Reject article

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug статьи для отклонения (папка в _pending/)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove pending article
        run: |
          if [ -d "_pending/${{ inputs.slug }}" ]; then
            rm -rf "_pending/${{ inputs.slug }}"
            echo "Удалён _pending/${{ inputs.slug }}"
          else
            echo "Папка _pending/${{ inputs.slug }} не найдена."
            exit 0
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f _pending/ || true
          if git diff --staged --quiet; then
            echo "Нет изменений."
          else
            git commit -m "Reject [ru]: ${{ inputs.slug }}"
            git pull --rebase origin main || true
            git push
          fi
