name: Refresh suggested/queue snapshots

# Читает Google Sheets и сохраняет snapshot-ы в .bot_state/cache/:
#   - suggested_snapshot.json — все строки со status=suggested
#   - queue_snapshot.json     — все строки со status=queued
# Бот в TG читает эти snapshot-ы через GitHub Contents API — это на порядок
# быстрее, чем каждый раз ходить в Sheets. Обновление — по кнопке (/suggested,
# /queue), по расписанию, ИЛИ сразу после approve/reject (там свой snapshot-шаг).

on:
  workflow_dispatch:
  # Раз в час — на случай если оператор что-то поправил в таблице вручную
  schedule:
    - cron: '15 * * * *'
  # После апрува/реджекта через отдельные workflows (workflow_run) —
  # оставлено как подстраховка; основную пересборку approve/reject делают сами.
  workflow_run:
    workflows: ["Approve topic (row → queued)", "Reject topic row"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sheets-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r automation/requirements.txt

      - name: Dump snapshots
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          PYTHONPATH: automation
        run: |
          # Единая логика пересборки — в bot_v2.suggested_topics snapshot
          # (без lang-фильтра, показывает все темы: ru/uk/legacy).
          python -m bot_v2.suggested_topics snapshot

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f .bot_state/cache/ || true
          if git diff --staged --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "bot: refresh Sheets snapshots"
            git pull --rebase origin main || true
            git push
          fi
