name: Generate partner page (template)

on:
  workflow_dispatch:
    inputs:
      partner_id:
        description: 'ID партнёра из _partner_drafts/ (напр. tonpoker)'
        required: true
        type: string
      publish:
        description: 'Сразу в прод? (иначе в _pending_partner)'
        required: false
        default: 'false'
        type: string
      chat_id:
        description: 'Telegram chat_id (куда прислать превью/итог). Пусто → в TELEGRAM_CHAT_ID'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: generate-partner-tpl
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Generate page from template
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARTNER_ID: ${{ github.event.inputs.partner_id }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "Publish mode: $PARTNER_ID -> prod"
            python automation/generate_partner_tpl.py --id "$PARTNER_ID" --publish
          else
            echo "Preview mode: $PARTNER_ID -> _pending_partner"
            python automation/generate_partner_tpl.py --id "$PARTNER_ID"
          fi

      - name: Rebuild catalog (partners.js)
        run: python automation/build_partners.py

      - name: Smoke test page
        id: smoke
        continue-on-error: true
        env:
          PARTNER_ID: ${{ github.event.inputs.partner_id }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            OUT=$(python automation/test_partner_page.py --id "$PARTNER_ID" 2>&1) && RC=0 || RC=1
          else
            OUT=$(python automation/test_partner_page.py --id "$PARTNER_ID" --pending 2>&1) && RC=0 || RC=1
          fi
          echo "$OUT"
          SUMMARY=$(printf '%s' "$OUT" | head -1)
          if [ "$RC" -eq 0 ]; then echo "smoke_ok=1" >> "$GITHUB_OUTPUT"; else echo "smoke_ok=0" >> "$GITHUB_OUTPUT"; fi
          echo "smoke_summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "kozyr-bot"
          git config user.email "bot@kozyr.club"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "partner (tpl): ${{ github.event.inputs.partner_id }}"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Attempt $attempt failed, retrying..."
              sleep $((RANDOM % 4 + 2))
            done
          fi

      - name: Notify Telegram (preview link + smoke result + buttons)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          PARTNER_ID: ${{ github.event.inputs.partner_id }}
          PUBLISH: ${{ github.event.inputs.publish }}
          SMOKE_OK: ${{ steps.smoke.outputs.smoke_ok }}
          SMOKE_SUMMARY: ${{ steps.smoke.outputs.smoke_summary }}
        run: python automation/notify_partner_ready.py
