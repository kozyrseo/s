name: Generate article

on:
  workflow_dispatch:
    inputs:
      topic_file:
        description: 'Путь к JSON-теме. ОСТАВЬ ПУСТЫМ, чтобы брать из Google Sheets (обычный режим).'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: generate-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run generator
        env:
          ANTHROPIC_API_KEY: ${{
