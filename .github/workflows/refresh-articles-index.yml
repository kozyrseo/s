name: Refresh articles index

# Пересобирает индекс статей для команды /repost (список + статусы).
# Индекс обновляется:
#   • после публикации (в publish-multilang.yml) — новая статья в списке
#   • после репоста (repost.yml / repost-drain.yml) — статусы ✅/⚪
#   • здесь по расписанию (раз в день) — гарантия свежести
#   • вручную (workflow_dispatch)
#
# Индекс лежит в .bot_state/cache/ (в .gitignore) — коммитим через git add -f.

on:
  schedule:
    - cron: "23 4 * * *"    # раз в день в 04:23 UTC
  workflow_dispatch:          # можно запустить вручную (для первого построения)

permissions:
  contents: write

concurrency:
  group: refresh-articles-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build articles index
        run: python automation/build_articles_index.py

      - name: Commit index (force — .bot_state is gitignored)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .bot_state/cache/articles_index.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Index unchanged."
          else
            git commit -m "Refresh articles index"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          fi
