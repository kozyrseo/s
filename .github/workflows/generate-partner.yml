name: Generate partner page

on:
  workflow_dispatch:
    inputs:
      partner_id:
        description: 'ID партнёра из _partner_drafts/ (напр. royalclub)'
        required: true
        type: string
      publish:
        description: 'Сразу в прод? (иначе в _pending_partner)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

concurrency:
  group: generate-partner
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Generate partner page
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARTNER_ID: ${{ github.event.inputs.partner_id }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "Publish mode: $PARTNER_ID → прод"
            python automation/generate_partner.py --id "$PARTNER_ID" --publish
          else
            echo "Preview mode: $PARTNER_ID → _pending_partner"
            python automation/generate_partner.py --id "$PARTNER_ID"
          fi

      - name: Rebuild partners.js
        run: python automation/build_partners.py

      - name: Commit changes
        run: |
          git config user.name "kozyr-bot"
          git config user.email "bot@kozyr.club"
          git add -A
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi
          git commit -m "partner: ${{ github.event.inputs.partner_id }}"
          # Тот же фикс гонки, что и в parse-partner.yml: воркер параллельно
          # пишет в main через Contents API, поэтому пушим с ретраями и
          # ребейзом перед каждой попыткой.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Изменения запушены с попытки $attempt"
              exit 0
            fi
            echo "Попытка $attempt не удалась, повтор через паузу..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Не удалось запушить изменения после 5 попыток"
          exit 1
